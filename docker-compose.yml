services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-gateway}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD:-gateway}@db:5432/${POSTGRES_DB:-gateway}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-please}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      PROVIDER_DEFAULT_TIMEOUT: "30"
      MAX_PROVIDER_ATTEMPTS: "5"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  admin:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
